host: "127.0.0.1"
port: 8088
token: "change-this-long-random-secret"

console:
  # Enables /console/exec for the Telegram admin panel.
  # Keep host bound to 127.0.0.1 or firewall this port, and use a strong token.
  enabled: true
  # "*" allows full console management. Replace with command prefixes for a stricter setup.
  allowed-commands:
    - "*"

chat-bridge:
  enabled: true
  # Messages must start with this prefix to reach Telegram. Leave empty to forward all chat.
  require-prefix-in-minecraft: ""
  # If a chat plugin cancels the normal chat event, only messages with this prefix are forwarded.
  incompatible-plugin-prefix: ""
  # How Telegram messages look in Minecraft. MiniMessage: https://docs.advntr.dev/minimessage/format
  # Placeholders: <sender>, <text>, <reply>. If <reply> is not used, the reply goes before the message.
  # After editing run /tgbridge reload.
  format:
    telegram-message: "<aqua>[TG] <sender>:</aqua> <white><text></white>"
    reply: "<gray>[Ответ: <reply>]</gray> "
