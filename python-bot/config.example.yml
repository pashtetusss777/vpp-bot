BOT_TOKEN: "PUT_TELEGRAM_BOT_TOKEN_HERE"
BOT_USERNAME: "@example_bot"
ADMIN_CHAT_ID: "-1001234567890"
FORUM_CHAT_ID: "123456789"
# Бот отвечает реплаем на сообщение, на которое реагирует.
REPLY_TO_MESSAGES: true
ADMINS:
  - "123456789"

QUESTIONS:
  - "1. Сколько вам полных лет?"
  - "2. Почему вы хотите присоединиться к нашему серверу?"
  - "3. Как вы узнали о нашем сервере?"
  - "4. Установлен ли у вас Simple Voice Chat? (Если у вас его нет, мы вас не примем. Гайд есть на форуме.)"
  - "5. С правилами сервера вы ознакомились? (Ознакомиться можно на форуме. Ссылка: https://t.me/+lAYJTso6aVwxZjY6)"

MESSAGES:
  ENTER_NICKNAME: "Для начала, пожалуйста, введите ваш никнейм в Minecraft (точно как в лаунчере):"
  FORM_START: "Привет! Чтобы попасть на сервер, вам нужно ответить на несколько вопросов. Начнем."
  RULES: |
    <b>Правила сервера</b>

    1. Перед подачей заявки обязательно ознакомьтесь с правилами сервера на форуме.
    2. Ссылка на правила: https://t.me/+lAYJTso6aVwxZjY6
    3. Нажимая «Я ознакомлен», вы подтверждаете согласие с правилами.

    Нажми кнопку ниже, когда ознакомишься.
    Информация о поддержке проекта: /donate
  FORM_COMPLETE: "Спасибо! Ваша заявка отправлена на рассмотрение. Мы сообщим вам о решении."
  ALREADY_APPLIED: "Вы уже подали заявку. Пожалуйста, ожидайте ответа."
  APPLICATION_ACCEPTED: "Поздравляем! Ваша заявка принята. Вы были добавлены в вайтлист и можете заходить на сервер."
  APPLICATION_REJECTED: "К сожалению, ваша заявка была отклонена. Можете попробовать ее заново переподать :3"
  APPLICATION_BANNED: "Вы были заблокированы и больше не можете подавать заявки."

BRIDGE:
  BASE_URL: "http://127.0.0.1:8088"
  TOKEN: "change-this-long-random-secret"
  TIMEOUT_SECONDS: 5

CHAT_BRIDGE:
  ENABLED: true
  # Номера тем форума. Узнать номер: /topic в нужной теме.
  # STATUS — запуск и остановка сервера.
  # CHAT — сообщения игроков, вход, выход, смерти и достижения.
  STATUS_TOPIC_ID: ""
  CHAT_TOPIC_ID: ""
  MERGE_WINDOW: 0
  LEAVE_JOIN_MERGE_WINDOW: 0
  REQUIRE_PREFIX_MINECRAFT: ""
  REQUIRE_PREFIX_TELEGRAM: ""
  KEEP_PREFIX: false
  USE_REAL_USERNAME: false
  SILENT_EVENTS: []
  EVENTS:
    START: true
    STOP: true
    JOIN: true
    LEAVE: true
    DEATH: true
    ADVANCEMENT: true
    ADVANCEMENT_TASK: true
    ADVANCEMENT_GOAL: true
    ADVANCEMENT_CHALLENGE: true
    ADVANCEMENT_DESCRIPTION: true
  # Вид сообщений в Telegram. Можно HTML: <b>, <i>, <u>, <s>, <code>, <tg-spoiler>.
  # Подстановки: {name}, {text}, {title}, {description}, {count}, {players},
  # {tps}, {tps5m}, {tps15m}, {mspt}, {error}. Пустая строка — не отправлять.
  # Удалите ключ, чтобы вернуть вид по умолчанию.
  FORMAT:
    SERVER_START: "✅ Сервер запущен!"
    SERVER_STOP: "❌ Сервер остановлен!"
    JOIN: "🥳 {name} зашёл на сервер"
    FIRST_JOIN: "🥳 {name} в первый раз зашёл на сервер"
    LEAVE: "😕 {name} покинул сервер"
    DEATH: "☠️ {text}"
    DEATH_UNKNOWN: "☠️ {name} погиб"
    ADVANCEMENT_TASK: "😼 {name} получил достижение <b>{title}</b>"
    ADVANCEMENT_GOAL: "🎯 {name} достиг цели <b>{title}</b>"
    ADVANCEMENT_CHALLENGE: "🏅 {name} завершил испытание <b>{title}</b>"
    ADVANCEMENT_DESCRIPTION: "\n<i>{description}</i>"
    CHAT: "<b>{name}</b>: {text}"
    LIST: "📝 Онлайн {count}: {players}"
    LIST_EMPTY: "📝 Сейчас никто не играет"
    TPS: "📊 TPS: <code>{tps}</code>\n⏱️ MSPT: <code>{mspt}</code>"
    SERVER_UNAVAILABLE: "Сервер недоступен: {error}"
  # Вид сообщений из Telegram внутри Minecraft. Формат MiniMessage:
  # <aqua>, <gray>, <#ff8800>, <bold>, <gradient:#5e4fa2:#f79459>...</gradient>.
  # Подстановки: <sender> — ник в Telegram, <text> — сообщение,
  # <reply> — цитата, если это ответ. MESSAGE пусто — взять формат из конфига плагина.
  # REPLY: false или "" — не показывать цитату в игре.
  MINECRAFT_FORMAT:
    MESSAGE: "<reply><aqua>[TG] <sender>:</aqua> <white><text></white>"
    REPLY: "<gray>[Ответ: <reply>]</gray> "
    EDIT_PREFIX: "✎ "

DATABASE:
  PATH: "applications.db"
  BACKUP_DIR: "backups"
  BACKUP_KEEP_LAST: 30
