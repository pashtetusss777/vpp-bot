services:
  vanilla-pp-bot:
    image: vanilla-pp-bot:latest
    pull_policy: never
    container_name: vanilla-pp-bot
    user: "1000:1000"
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/pashtet/vpp-bot/python-bot/config.yml:/app/config.yml:ro
      - vanilla_pp_bot_data:/data
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: "Europe/Minsk"

volumes:
  vanilla_pp_bot_data:
